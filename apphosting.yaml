# Firebase App Hosting — the combined single-process deploy (PRD §8.1, §12).
#
# Nothing here is left to framework auto-detection. App Hosting infers a build
# and start command from the framework it thinks it sees, and this repository is
# an npm workspace with three packages and no framework at its root — so both
# commands are stated outright. `rootDir: "/"` in firebase.json keeps
# package-lock.json at the root of the build workspace, where the installer
# looks.
#
# THIS REPO IS ON npm BECAUSE OF THE BUILDPACK, not by preference. pnpm was the
# package manager until the App Hosting build proved unable to install it:
#
#   1. The buildpack reads `engines.pnpm` as a RANGE and installs the highest
#      match, ignoring `packageManager`. An open `">=10"` selected pnpm 12,
#      whose >= 11 branch in the buildpack is broken — it unpacks the standalone
#      binary then launches it as `node <layer>/bin/dist/pnpm.mjs`, a path that
#      exists only in the npm package layout. MODULE_NOT_FOUND, before a single
#      dependency installed.
#   2. Capping at 9.x fixed that and exposed the real blocker:
#      `pnpm install --prod` dies with "Cannot convert undefined or null to
#      object" in ~314ms — before any network fetch, so a config parse. That is
#      firebase-tools#10435, filed for pnpm monorepos on any pnpm version, and
#      CLOSED AS NOT PLANNED. It does not reproduce locally on any pnpm 9 or 10,
#      cold store, or buildpack env var; it happens only inside the buildpack.
#
# So: do not "restore pnpm" here. It is not a preference that was lost, it is a
# deploy that does not build. If it is ever revisited, check whether #10435 has
# been reopened and fixed first.
#
# There is deliberately NO `engines.npm`. The buildpack resolves an engines
# range to the highest published match, which is exactly how the pnpm 12 failure
# happened; leaving it unset uses the npm bundled with the Node runtime, which
# is the best-tested path through this buildpack.

runConfig:
  cpu: 1
  memoryMiB: 1024
  # Scale to zero between demos; the cold start is a Nest boot, not a build.
  minInstances: 0
  maxInstances: 2
  concurrency: 40

scripts:
  # shared -> backend -> frontend, in that order. A missing shared/dist shows up
  # as TS2307 in both consumers at once.
  buildCommand: npm run build
  # The composed process: Nest owns /api/*, the Angular SSR handler takes the
  # rest. See server.mjs, and backend/test/routing-contract.e2e-spec.ts for the
  # contract it depends on.
  runCommand: node server.mjs

env:
  # Marks this as the deployed environment. EnvService reads it to decide that
  # PARTNER_DEMO_ORIGIN has no localhost default here — otherwise /agent would
  # embed an iframe pointing at each visitor's own machine.
  #
  # RUNTIME only, and that is load-bearing. `EnvService.partnerOrigin` is the
  # only reader in the repo and it runs per request; nothing in the build looks
  # at NODE_ENV (Angular takes `production` from angular.json, not the env). But
  # the buildpack installs production-only under NODE_ENV=production, which
  # drops every devDependency — and the whole build is devDependencies:
  # the Angular CLI, the Nest CLI, typescript. Granting this BUILD availability
  # produces a build that cannot find `ng`.
  - variable: NODE_ENV
    value: production
    availability: [RUNTIME]

  # Angular 21 refuses to server-render a request whose Host header is not on an
  # allowlist (SSRF protection). Off the allowlist it does NOT fail loudly — it
  # silently falls back to client-side rendering, which would quietly undo the
  # SSR and structured-data work in PRD §8.5, and the Angular team have said it
  # becomes a hard 400 in a future major.
  #
  # This REPLACES the build-time list in angular.json rather than adding to it
  # (`getAllowedHostsFromEnv() ?? options.allowedHosts`), so everything the
  # deployed service answers on has to be here. The two wildcards cover the
  # default App Hosting domain (<backend>--<project>.<region>.hosted.app) and
  # the underlying Cloud Run URL. Narrow this to the exact hostname once the
  # backend exists, and add any custom domain.
  #
  # Verify after a deploy: the HTML for `/` must contain `ng-server-context`.
  # If it does not, this value is wrong and the site is rendering client-side.
  - variable: NG_ALLOWED_HOSTS
    value: "*.hosted.app,*.run.app,*.web.app,*.firebaseapp.com,*.programmersingh.dev"
    availability: [RUNTIME]

  # The Supabase project URL is not a credential; the service-role key below is.
  - variable: SUPABASE_URL
    value: https://dfzgtalbqtcadgupwklo.supabase.co
    availability: [RUNTIME]

  # --- Secrets ------------------------------------------------------------
  #
  # RUNTIME only: the build never touches Supabase or signs a token, and a
  # secret readable at build time is a secret in the build logs.
  #
  # EnvService raises MissingEnvError at *call* time rather than import time, so
  # a missing or misconfigured secret surfaces as a failure on the routes that
  # need it — not as a container that will not start and cannot be inspected.
  #
  # Create each one with:  firebase apphosting:secrets:set <name>
  - variable: SUPABASE_SERVICE_ROLE_KEY
    secret: actuo-supabase-service-role-key
    availability: [RUNTIME]
  - variable: JWT_ACCESS_SECRET
    secret: actuo-jwt-access-secret
    availability: [RUNTIME]
  - variable: JWT_REFRESH_SECRET
    secret: actuo-jwt-refresh-secret
    availability: [RUNTIME]

  # The public origin, stamped into sitemap.xml, robots.txt and the og: tags by
  # scripts/stamp-seo.mjs at build time. BUILD availability, not RUNTIME: the
  # public pages are prerendered, so there is no request to derive an origin
  # from and the value has to be present while the build runs.
  #
  # Unset, every URL stays root-relative — valid, but the sitemap is not
  # spec-compliant and scrapers may not resolve og:image.
  #
  # This is an ORIGIN, so it must carry the scheme. stamp-seo.mjs substitutes the
  # value verbatim (it only trims trailing slashes), so a bare hostname yields
  # `<loc>actuo.programmersingh.dev/</loc>` — not a URL, and `new URL()` rejects
  # it. Nothing fails the build; the sitemap is just quietly invalid.
  #
  # PREREQUISITE: this domain must actually resolve and be attached to the
  # backend. It was NXDOMAIN when this value was set, and a canonical pointing at
  # a host that does not resolve is worse than a relative one — it tells crawlers
  # the real URL is dead. Add it as a custom domain on the App Hosting backend,
  # point DNS at it, then confirm with `host actuo.programmersingh.dev`. Until
  # that is done the deploy is fine and only the SEO metadata is wrong.
  - variable: PUBLIC_ORIGIN
    value: "https://actuo.programmersingh.dev"
    availability: [BUILD]

  # --- Optional, with sane defaults in EnvService --------------------------
  - variable: BASE_CURRENCY
    value: INR
    availability: [RUNTIME]

  # PARTNER_DEMO_ORIGIN is deliberately absent. It must be an origin that is NOT
  # this app's, or the cross-origin demo proves nothing — /agent explains that
  # when it is unset. Set it once the partner page has a host of its own.

# NOTE: PORT is injected by Cloud Run and must not be set here. server.mjs reads
# it and falls back to 8080.
